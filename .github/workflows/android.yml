name: Android CI

on:
  workflow_dispatch:
    inputs:
      nightly:
        type: choice
        default: 'false'
        description: use latest tunnel and ziti SDKs
        options: [ 'true', 'false' ]
      ziti_version:
        type: string
        default: 'stable'
        description: ziti version for the integration tests ('stable', or a tag or tag-regex like 'v1.6')

  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# cancel previous run for the same PR/branch
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-deps:
    uses: ./.github/workflows/build-dependencies.yml
  integration:
    needs:
      - build-deps
    permissions:
      contents: read
      checks: write
    uses: ./.github/workflows/integration-test.yml
    with:
      ziti_version: ${{ inputs.ziti_version || 'stable' }}
  build:
    env:
      BUILD_TYPE: ${{ secrets.RELEASE_KEYSTORE == '' && 'Debug' || 'Release' }}
    runs-on: ubuntu-latest
    needs:
      - build-deps
    steps:
    - run: env
    - uses: actions/checkout@v7
      with:
        fetch-depth: '0'

    - name: setup build
      shell: bash
      run: |
        CI_CACHE=${GITHUB_WORKSPACE}/.ci_cache
        VCPKG_BINARY_SOURCES="clear;files,${GITHUB_WORKSPACE}/.ci_cache,readwrite"
        mkdir -p ${CI_CACHE}
        echo "CI_CACHE=${CI_CACHE}" >> ${GITHUB_ENV}
        echo "VCPKG_BINARY_SOURCES=${VCPKG_BINARY_SOURCES}" >> ${GITHUB_ENV}

    - name: Build App (${{ env.BUILD_TYPE }})
      uses: ./.github/actions/gradle
      with:
        buildType: ${{ env.BUILD_TYPE }}
        experimental: ${{ inputs.nightly }}
        runTests: false
        keystore: ${{ secrets.RELEASE_KEYSTORE }}
        keystorePassword: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}

    - uses: actions/upload-artifact@v7
      with:
        name: ziti-mobile-edge-${{ env.BUILD_TYPE }}.aab
        path: app/build/outputs/bundle/*/*.aab

    - uses: actions/upload-artifact@v7
      with:
        name: ziti-mobile-edge-${{ env.BUILD_TYPE }}.apk
        path: app/build/outputs/apk/*/*.apk
