name: Publish Release

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  release:
    types: [published]

jobs:
  build-deps:
    uses: ./.github/workflows/build-dependencies.yml
  build:
    runs-on: ubuntu-latest
    needs:
      - build-deps
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: setup build
        shell: bash
        run: |
          CI_CACHE=${GITHUB_WORKSPACE}/.ci_cache
          VCPKG_BINARY_SOURCES="clear;files,${GITHUB_WORKSPACE}/.ci_cache,readwrite"
          mkdir -p ${CI_CACHE}
          echo "CI_CACHE=${CI_CACHE}" >> ${GITHUB_ENV}
          echo "VCPKG_BINARY_SOURCES=${VCPKG_BINARY_SOURCES}" >> ${GITHUB_ENV}

      - name: Build App
        uses: ./.github/actions/gradle
        with:
          buildType: Release
          experimental: ${{ github.ref == 'refs/heads/main' && 'true' || 'false' }}
          keystore: ${{ secrets.RELEASE_KEYSTORE }}
          keystorePassword: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}

      - name: Upload Release artifacts
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          fail_on_unmatched_files: true
          files: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk

      - name: publish experimental release
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: experimental
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(app/build/outputs/bundle/release/*.aab app/build/outputs/apk/release/*.apk)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::no release artifacts found"
            exit 1
          fi

          # point the rolling tag at the commit that was just built, creating it if needed
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" > /dev/null 2>&1; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG}" -f sha="${GITHUB_SHA}" -F force=true > /dev/null
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/tags/${TAG}" -f sha="${GITHUB_SHA}" > /dev/null
          fi

          if gh release view "${TAG}" > /dev/null 2>&1; then
            gh release edit "${TAG}" --prerelease
          else
            gh release create "${TAG}" --verify-tag --prerelease --title "${TAG}" --notes ""
          fi

          gh release upload "${TAG}" "${files[@]}" --clobber

          # drop assets left over from earlier builds
          keep=$(printf '%s\n' "${files[@]##*/}")
          gh release view "${TAG}" --json assets --jq '.assets[].name' | while read -r name; do
            grep -qxF -- "${name}" <<< "${keep}" || gh release delete-asset "${TAG}" "${name}" --yes
          done
